
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ex1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ex1
  template:
    metadata:
      labels:
        app: ex1
    spec:
      containers:
        - name: ex1
          image: NUME_DOCKERHUB/lab3-docker:ex1
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: ex1-service
spec:
  selector:
    app: ex1
  ports:
    - port: 8081
      targetPort: 8081
